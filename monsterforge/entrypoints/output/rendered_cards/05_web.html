<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WEB</title>
<style>
  /*
    10mm margin fits safely inside both A4 (210x297mm) and US Letter
    (215.9x279.4mm) without needing to detect which one is active —
    print-time detection of the OS/printer's selected page size is
    inconsistently supported across browsers, so this design
    deliberately avoids depending on it.
  */
  @page {
    margin: 10mm;
  }
  body {
    background: #2b2b2b;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
  }
  .controls-row {
    width: 560px;
    margin-bottom: 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .controls-row button, .controls-row a {
    padding: 0.5rem 1.5rem;
    font-size: 1rem;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    background: #e8ddc4;
    border: 2px solid #333;
    border-radius: 4px;
    font-family: Georgia, "Times New Roman", serif;
  }

  /*
    NOTE:
    On-screen only: shrinks the card to fit within 80% of the viewport
    height on short screens, instead of forcing a scrollbar. Same
    transform: scale() technique as the print rule below (a max-height
    alone would clip the card's fixed-height sections rather than
    shrinking them together), but the ratio is computed in JavaScript
    (see move_card_print_script.html.jinja2) rather than pure CSS
    calc()/min() — dividing two different CSS units (vh, px) into a
    plain number for scale() relies on CSS math-function support that
    isn't reliably available in every browser yet, confirmed not to
    take effect in at least one real test. --screen-scale is a custom
    property, not the transform property itself, specifically so the
    @media print rule below (a plain, self-contained transform
    declaration) keeps winning during printing through normal CSS
    cascade — an inline style directly on `transform` would otherwise
    always win over any stylesheet rule, print media query included.
  */
  .card {
    transform: scale(var(--screen-scale, 1));
    transform-origin: top center;
  }

  /*
    NOTE:
    A physically accurate print needs the card at its real ~63x88mm
    size (Magic-style), not the 560px width sized for comfortable
    screen viewing. Rather than rewriting every nested px value in
    move_card_style.html.jinja2 in mm (dozens of fixed heights/paddings
    across header/art/body-section/etc.), a single uniform transform:
    scale() on .card preserves every internal proportion exactly as
    designed on screen. The factor is derived from width only (560px ->
    63mm, using the standard 96px = 1in = 25.4mm conversion: 63 / (560 *
    25.4 / 96) ~= 0.4252) since width is the one dimension with no
    min-height ambiguity in the source CSS. This card's actual pixel
    ratio (~560:815) isn't a perfect match for 63:88 (the .art section
    uses min-height, not a fixed height), so the printed height comes
    out around 91-92mm rather than exactly 88mm — undistorted, just
    not pinned to both dimensions at once. Deliberately left as-is
    rather than adjusting the screen layout's fixed heights to true up
    the ratio, since that's already-approved visual design from an
    earlier session, not something to change for print's sake alone.
  */
  @media print {
    .controls-row {
      display: none;
    }
    body {
      background: none;
      padding: 0;
      align-items: flex-start;
    }
    .card {
      transform: scale(0.4252);
      transform-origin: top left;
    }
  }
</style>
<style>
  /*
    Per-card values (accent color, background image, bonus-column
    layout) are NOT baked in here as Jinja variables — this stylesheet
    is included once per page, but a gallery page embeds many cards
    with different values on the same page. Each .card instance carries
    its own --accent-color custom property and its own inline
    background-image, set in move_card_fragment.html.jinja2; the
    bonus-column layout switches on a .has-bonus class instead of a
    templated flex value. See gallery_renderer.py for why this matters.
  */
  .card {
    /*
      NOTE:
      560px width matches the Magic-style physical card ratio (63:88,
      see PIPELINE_ARCHITECTURE.md decision 6) against this card's total
      height (~815px across the fixed-height sections below) — the card
      was originally 420px wide, visibly narrower/taller than that ratio.
    */
    width: 560px;
    background: #e8ddc4;
    border: 10px solid #111;
    border-radius: 14px;
    overflow: hidden;
    /*
      NOTE:
      The second, colored inner border (matching the two reference
      mockups, where the whole card frame was accent-colored rather than
      plain black) is an inset box-shadow, not a second CSS border — a
      real second border would need an extra wrapper element, while an
      inset box-shadow with zero blur/spread draws flush against the
      inside edge of the existing black border for free.
    */
    box-shadow: 0 0 24px rgba(0, 0, 0, 0.6), inset 0 0 0 5px var(--accent-color);
    font-family: Georgia, "Times New Roman", serif;
    color: #2a2015;
  }
  .card-header {
    /*
      NOTE:
      Fixed height, sized for a 2-line NAME (the box that can realistically
      wrap — CATEGORY/TYPE are always one short word) plus this row's own
      padding, so a 1-line name and a 2-line name produce the same header
      height instead of a taller header only on long-name cards.
    */
    display: flex;
    align-items: stretch;
    height: 110px;
    gap: 8px;
    padding: 10px;
    background: #c9bd9e;
    border-bottom: 6px solid var(--accent-color);
  }
  .name-box, .category-box {
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: #d8cdae;
    border: 2px solid #333;
    border-radius: 4px;
    text-align: center;
    padding: 6px;
    overflow: hidden;
  }
  .name-box {
    /*
      NOTE:
      NAME gets more of the header's width than CATEGORY (2:1, not 1:1)
      because CATEGORY only ever holds one of three short words
      (ATTACK/DEFENSE/SPECIAL) while NAME is free text that can run long
      ("Incorporeal touch"). min-width: 0 overrides the flex-item default
      of min-width: auto, which would otherwise stop the ellipsis below
      from ever kicking in — a flex child won't shrink past its content's
      natural width unless min-width is explicitly reset.
    */
    flex: 2;
    min-width: 0;
  }
  .category-box {
    flex: 1;
  }
  .name-box .field-value {
    font-size: 18px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .type-badge {
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100px;
    flex-shrink: 0;
    background: var(--accent-color);
    color: #2a2015;
    border: 2px solid #333;
    border-radius: 4px;
    text-align: center;
    padding: 6px 2px;
    overflow: hidden;
  }
  .field-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.8;
  }
  .field-value {
    font-size: 20px;
    font-weight: bold;
  }
  .type-badge .field-value {
    /*
      NOTE:
      16px is close to the largest size that still fits "PHYSICAL" (the
      longer of the two MoveType values) inside the 100px-wide badge
      without wrapping — white-space: nowrap plus the badge's own
      overflow: hidden are the safety net if a future value is longer.
    */
    font-size: 16px;
    white-space: nowrap;
  }
  .art {
    position: relative;
    min-height: 320px;
    background-color: #ded2b0;
    background-size: cover;
    background-position: center;
    border-top: 4px solid #333;
    border-bottom: 4px solid #333;
  }
  .art .image-label {
    text-align: center;
    padding: 10px;
    font-weight: bold;
    letter-spacing: 3px;
  }
  .active-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--accent-color);
    color: #2a2015;
    padding: 7px 14px;
    border: 2px solid #333;
    border-radius: 4px;
    font-weight: bold;
    font-size: 13px;
  }
  .resource-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
  }
  .resource-box, .range-box {
    background: var(--accent-color);
    color: #2a2015;
    border: 2px solid #333;
    border-radius: 4px;
    padding: 6px 14px;
    text-align: center;
  }
  .resource-box .field-value, .range-box .field-value {
    font-size: 24px;
  }
  .body-section {
    /*
      NOTE:
      Fixed height (not min-height) so every card is the same total
      height regardless of content — bonus_cards is capped at
      MAX_BONUS_CARDS (3, in move_card_renderer.py) and effect-text is
      clamped to 2 lines below, so 190px covers the worst case (3 bonus
      card entries) with a small safety margin; overflow: hidden is a
      guard, not the primary mechanism.
    */
    display: flex;
    height: 190px;
    overflow: hidden;
    padding: 14px;
    gap: 14px;
  }
  .effect-col {
    flex: 2;
  }
  .body-section.has-bonus .effect-col {
    flex: 1;
  }
  .bonus-col {
    flex: 1;
    border-left: 2px solid #333;
    padding-left: 14px;
  }
  .section-label {
    text-align: center;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-bottom: 3px double #333;
    padding-bottom: 4px;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .effect-text {
    text-align: center;
    font-weight: bold;
    font-size: 16px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .bonus-list {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 14px;
  }
  .bonus-list li {
    margin-bottom: 8px;
  }
  .bonus-name {
    font-weight: bold;
  }
  .bonus-id {
    font-size: 11px;
    opacity: 0.75;
    margin-top: 2px;
  }
  .description-section {
    padding: 0 14px 14px 14px;
  }
  .description-section p {
    /*
      NOTE:
      height (fixed, not just a line-clamp cap) so a short description
      and a full 3-line description occupy the same space — line-clamp
      alone only bounds the maximum, a 1-line description would still
      leave a shorter box than a 3-line one without an explicit height.
      This is a rendering-side cap, not a domain constraint: the full
      text is still in MoveCard.description and visible in full via the
      JSON view — it should just never actually get cut in practice.

      classify_attack()'s prompt (llm/prompts/attacks/classify_attack.jinja2)
      now instructs the LLM to keep description under 160 characters,
      chosen from this box's own capacity: ~532px text width at 15px
      regular Georgia serif over 3 lines is roughly 180-190 characters
      before word-wrap efficiency loss, and the 64 real pipeline samples
      collected so far top out at 135 characters (avg 65) — 160 leaves
      headroom above real usage while staying under the hard render
      limit. Some touch attacks' descriptions include an LLM-volunteered
      aside ("This attack grants a +2 attack-roll bonus when used.",
      52 chars) that isn't prompt-instructed — the 160-char cap bounds
      the total regardless of whether that aside is included, rather
      than reserving separate budget for it.
    */
    margin: 0;
    height: 64px;
    font-size: 15px;
    text-align: center;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .footer {
    text-align: center;
    padding: 8px;
    border-top: 4px solid #333;
    font-size: 12px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="controls-row">
  <button type="button" onclick="window.print()">Print</button>
</div>
  <div class="card" style="--accent-color: #c17f68;">
    <div class="card-header">
      <div class="name-box">
        <div class="field-label">NAME</div>
        <div class="field-value">WEB</div>
      </div>
      <div class="category-box">
        <div class="field-label">CATEGORY</div>
        <div class="field-value">ATTACK</div>
      </div>
      <div class="type-badge">
        <div class="field-label">TYPE</div>
        <div class="field-value">PHYSICAL</div>
      </div>
    </div>
    <div class="art">
      
      <div class="image-label">IMAGE</div>
      
      <div class="active-badge">ACTIVE</div>
    </div>
    <div class="resource-row">
      <div class="resource-box">
        <div class="field-label">STAMINA</div>
        <div class="field-value">1</div>
      </div>
      
      <div class="range-box">
        <div class="field-label">RANGE</div>
        <div class="field-value">15.0</div>
      </div>
      
    </div>
    <div class="body-section">
      <div class="effect-col">
        <div class="section-label">EFFECT</div>
        <div class="effect-text"></div>
      </div>
      
    </div>
    <div class="description-section">
      <div class="section-label">DESCRIPTION</div>
      <p>A thick mass of sticky webbing is hurled to snare and anchor the target in place.</p>
    </div>
    <div class="footer">ID: 546a30b8-1927-4603-b249-34ee216ceb02</div>
  </div>
<script>
  var card = document.querySelector(".card");
  var naturalHeight = card.getBoundingClientRect().height;
  var maxHeight = window.innerHeight * 0.8;

  if (naturalHeight > maxHeight) {
    var ratio = maxHeight / naturalHeight;
    card.style.setProperty("--screen-scale", ratio);
  }
</script>
</body>
</html>
